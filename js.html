    <script>
        // checking gender of the user
      function check(gen){
        if(gen=="m"){
            return "male";
        }
        else if (gen=="f"){
            return 'female';
        }
        else{
            let x=confirm('Are u sure');
            if(x){
                return 'not registered';
            }
            else{
                return "please try again";
            }
        }
      }  
      let gender= prompt("what is your gender--'m' or 'f'");
      gender=check(gender);
      alert(gender);

    //   practicing arrow functions
      let say=(a,b)=>a+b;
      alert(say(2,4));
      let double=n=>n*2;
      alert(double(4));

    //   fuzzbuzz game
      let num=prompt("enter a number");
      for(let i=1;i<=num;i++){
        if(i%3==0){
            alert("fuzz");
        }
        else if(i%5==0){
            alert("buzz");
        }
        else {
            alert(i);}
      }

    /* arr.indexOf(item, from) – looks for item starting from index from, and returns the index where it was found,

    arr.sort(); // sort compares the elemnts as strings eg.[1,2,15]=>[1,15,2]
    arr.sort(function(a,b){return a-b});

        return num%2!==0;// this returns true if the number is odd
    }
    let numbers=[1,2,3,4,5,6];
    let odd=numbers.filter(oddNums);
    alert(odd);// filter creats a new array
